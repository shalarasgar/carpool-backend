openapi: 3.0.3
info:
  title: Carpool API
  version: 1.0.0
  description: |
    Backend for the Turkmenistan intercity carpool app (phase 1).

    Phone + OTP authentication, profiles, vehicles, the location directory,
    trips and bookings, reviews, blocks, reports, the in-app notification
    inbox, the Android SMS gateway, and the admin API.

    Approving a booking locks the trip row and never oversells seats. Phone
    numbers appear only on a booking, and only after it is approved. Trip
    status includes `expired` (a past trip that has no approved booking).

    **Localization.** Send `Accept-Language: tk`, `ru` or `en`. Error
    messages are localized; the default is `tk`. The response carries
    `Content-Language`. Inbox `title` and `body` follow the recipient's
    saved locale, not this header.

    **Error envelope.** Every error is
    `{"error":{"code":"STABLE_CODE","message":"<localized>","details":{...}}}`.
    `details` is present only for `VALIDATION_ERROR` and maps field name to
    the failed rule (`required`, `len`, `numeric`, ...). `code` is one of
    the values in the `Error` schema.

servers:
  - url: http://localhost:8080

tags:
  - name: health
  - name: auth
  - name: users
  - name: vehicles
  - name: locations
  - name: trips
  - name: bookings
  - name: gateway
    description: "Called by the Android SMS gateway app. Authenticate with `Authorization: Bearer <api_key>`."
  - name: admin
    description: "Operator endpoints. Authenticate with `Authorization: Bearer <ADMIN_TOKEN>`."

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /readyz:
    get:
      tags: [health]
      summary: Readiness
      description: 200 when the database answers. `sms_gateway_healthy` is informational and true when an active gateway heartbeated within `SMS_GATEWAY_HEALTHY_WINDOW` (default 30s).
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /v1/auth/request-otp:
    post:
      tags: [auth]
      summary: Send a one-time code by SMS
      description: |
        Normalizes the phone to E.164 (+993XXXXXXXX), applies rate limits
        (1 per phone per 60s, 5 per phone per day, per-IP and per-device
        caps) and queues the SMS. The response is identical for new,
        existing and blocked phones. With `DEV_MODE=true` the server also
        returns `dev_code` for local testing.
      parameters: [ { $ref: "#/components/parameters/AcceptLanguage" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  maxLength: 32
                  description: Any of +99365123456, 99365123456, 865123456, 65123456; spaces and dashes allowed.
                  example: "+99365123456"
                device_id:
                  type: string
                  maxLength: 128
                  description: Optional stable device identifier used for per-device rate limits.
      responses:
        "200":
          description: Code sent (or queued)
          content:
            application/json:
              schema:
                type: object
                required: [expires_in, retry_after]
                properties:
                  expires_in: { type: integer, description: Seconds the code stays valid, example: 300 }
                  retry_after: { type: integer, description: Seconds before another code may be requested, example: 60 }
                  dev_code: { type: string, description: Present only when DEV_MODE=true, example: "482913" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/verify-otp:
    post:
      tags: [auth]
      summary: Verify the code and sign in
      description: |
        Creates the user on first login. Wrong codes count toward
        `OTP_MAX_ATTEMPTS` (default 5); after that the code is invalidated.
        Any previous refresh tokens of the same `device_id` are revoked.
      parameters: [ { $ref: "#/components/parameters/AcceptLanguage" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, device_id]
              properties:
                phone: { type: string, example: "+99365123456" }
                code: { type: string, pattern: "^[0-9]{6}$", example: "482913" }
                device_id: { type: string, minLength: 1, maxLength: 128, example: "a1b2c3-flutter-device" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`OTP_INVALID`, `OTP_EXPIRED` or `OTP_ATTEMPTS_EXCEEDED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "`USER_BLOCKED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token
      description: |
        Returns a new access/refresh pair and revokes the presented refresh
        token. Presenting a token that was already rotated revokes every
        token of that device (`REFRESH_TOKEN_INVALID`); the app must sign
        in again.
      parameters: [ { $ref: "#/components/parameters/AcceptLanguage" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`REFRESH_TOKEN_INVALID` or `REFRESH_TOKEN_EXPIRED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "`USER_BLOCKED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Sign out this device
      description: |
        Revokes every refresh token of the device encoded in the access token.
        The access token itself stays valid until it expires (15 minutes).
        A blocked account is rejected with `403 USER_BLOCKED` and an anonymized
        account with `401`, even when the JWT signature is still valid.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/AcceptLanguage" } ]
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`USER_BLOCKED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me:
    get:
      tags: [users]
      summary: Caller's own profile
      description: Includes the phone number. Other users never receive it.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/AcceptLanguage" } ]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`USER_BLOCKED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [users]
      summary: Update name and locale
      description: Send either field or both. Name is 1–80 characters (letters, spaces, hyphen, apostrophe, dot). Locale is `tk`, `ru` or `en`.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/AcceptLanguage" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Aýna Amanowa" }
                locale: { type: string, enum: [tk, ru, en] }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`USER_BLOCKED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [users]
      summary: Anonymize the account
      description: |
        Clears the name and photo, revokes every refresh token, and replaces
        the phone with `anon:<hmac-sha256>:<user id>`. The cleartext number is
        not kept, so the same phone can register a new empty account. The old
        access token then returns `401`.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/AcceptLanguage" } ]
      responses:
        "204": { description: Anonymized }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`USER_BLOCKED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/photo:
    post:
      tags: [users]
      summary: Upload a profile photo
      description: |
        Multipart field name is `photo`. `PHOTO_MAX_BYTES` (default 2 MiB) and
        `PHOTO_ALLOWED_TYPES` (jpeg, png, webp) come from config. The server
        sniffs the bytes and ignores the part Content-Type, then re-encodes
        the image so metadata is dropped. WebP is stored as JPEG, or as PNG
        when the image has transparency. The file name is random. The returned
        `photo_url` is a path such as `/v1/media/photos/<file>`.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/AcceptLanguage" } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        "200":
          description: Profile with the new photo_url
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`USER_BLOCKED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: "`PHOTO_TOO_LARGE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`PHOTO_TYPE_UNSUPPORTED` or `VALIDATION_ERROR`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/media/photos/{name}:
    get:
      tags: [users]
      summary: Fetch a profile photo
      description: Public. `name` must be a generated 32-hex file name. No directory listing and no path traversal.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{32}\\.(jpg|png|webp)$" }
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404":
          description: "`NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/users/{id}:
    get:
      tags: [users]
      summary: Public profile
      description: |
        Requires a JWT. The body is the public profile only: name, photo,
        rating, the most recently created vehicle, and the number of completed
        trips (driven, plus ridden with an approved booking). The phone number
        is never included. An anonymized account is `404`.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`USER_BLOCKED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/vehicles:
    get:
      tags: [vehicles]
      summary: List my vehicles
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/AcceptLanguage" } ]
      responses:
        "200":
          description: Vehicles, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [vehicles]
                properties:
                  vehicles:
                    type: array
                    items: { $ref: "#/components/schemas/Vehicle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`USER_BLOCKED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [vehicles]
      summary: Add a vehicle
      description: |
        At most `MAX_VEHICLES_PER_USER` (default 3). Plate is uppercased and
        must contain 4–10 letters and digits, with spaces or hyphens as
        separators. A vehicle owned by someone else is `404`, the same as an
        unknown id.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/AcceptLanguage" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brand, model, color, plate]
              properties:
                brand: { type: string, example: Toyota }
                model: { type: string, example: Camry }
                color: { type: string, example: ak }
                plate: { type: string, example: "AG 1234 AB" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`USER_BLOCKED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`VALIDATION_ERROR` or `VEHICLE_LIMIT`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/vehicles/{id}:
    patch:
      tags: [vehicles]
      summary: Update my vehicle
      description: Omitted fields stay unchanged. Another user's vehicle is `404`.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand: { type: string }
                model: { type: string }
                color: { type: string }
                plate: { type: string }
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`USER_BLOCKED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [vehicles]
      summary: Delete my vehicle
      description: Another user's vehicle is `404`.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`USER_BLOCKED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/locations:
    get:
      tags: [locations]
      summary: List locations
      description: |
        Public. `active_only` defaults to true. `name` follows `Accept-Language`
        (`tk`, `ru`, `en`). `q` is a case-insensitive substring matched against
        the Turkmen, Russian and English names. The response has an `ETag`;
        send it back as `If-None-Match` to receive `304`. Send `Accept-Encoding: gzip`
        to compress the body. `Cache-Control` is `public, max-age=300`.
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - name: type
          in: query
          schema: { type: string, enum: [welayat, city, etrap] }
        - name: parent_id
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          schema: { type: string, maxLength: 64 }
        - name: active_only
          in: query
          schema: { type: boolean, default: true }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Matching locations
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: "public, max-age=300" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationList" }
        "304":
          description: Not modified. Empty body; `ETag` is still set.
        "422": { $ref: "#/components/responses/Unprocessable" }

  /gateway/v1/pending:
    get:
      tags: [gateway]
      summary: Claim pending SMS to send
      description: |
        Atomically claims up to `limit` pending messages for this gateway
        (`SELECT ... FOR UPDATE SKIP LOCKED`), marks them `processing`
        and locks them for `SMS_LOCK_DURATION` (default 60s). Also records a
        heartbeat. The gateway must call `/gateway/v1/report` for every
        message before `locked_until`; otherwise the server returns the
        message to `pending` and it may be claimed again.
      security: [ { gatewayKey: [] } ]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 10 }
          description: Clamped to `SMS_GATEWAY_MAX_BATCH` (default 50).
      responses:
        "200":
          description: Claimed messages (possibly empty)
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/GatewayMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /gateway/v1/report:
    post:
      tags: [gateway]
      summary: Report a delivery result
      description: |
        `sent` marks the message delivered. `failed` increments `attempts`
        and returns the message to `pending`; after `SMS_MAX_ATTEMPTS`
        (default 3) it is marked `failed` permanently. Only the gateway that
        claimed the message may report it.
      security: [ { gatewayKey: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [sent, failed] }
                error: { type: string, maxLength: 500, description: Free-text reason when status is failed. }
      responses:
        "200":
          description: Queue state after the report
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [sent, pending, failed] }
                  attempts: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`SMS_NOT_FOUND`: unknown id, not claimed by this gateway, or already final"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /gateway/v1/heartbeat:
    post:
      tags: [gateway]
      summary: Heartbeat
      description: Marks the gateway healthy. Call it at least every 20 seconds when idle; `/pending` and `/report` also count as heartbeats.
      security: [ { gatewayKey: [] } ]
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateway: { type: string }
                  server_time: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/v1/gateways:
    get:
      tags: [admin]
      summary: List SMS gateways and health
      description: |
        Each gateway is healthy when it is active and heartbeated within
        `SMS_GATEWAY_HEALTHY_WINDOW`. The API key and its hash are not returned.
      security: [ { adminToken: [] } ]
      responses:
        "200":
          description: Gateways
          content:
            application/json:
              schema:
                type: object
                required: [gateways]
                properties:
                  gateways:
                    type: array
                    items:
                      type: object
                      required: [id, name, is_active, healthy, operator_prefixes, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        is_active: { type: boolean }
                        healthy: { type: boolean }
                        last_heartbeat_at: { type: string, format: date-time, nullable: true }
                        operator_prefixes: { type: array, items: { type: string } }
                        created_at: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Register an SMS gateway
      description: Returns the plain API key exactly once. Only its SHA-256 is stored.
      security: [ { adminToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64, example: android-phone-1 }
                operator_prefixes:
                  type: array
                  maxItems: 16
                  items: { type: string, pattern: "^[0-9]{1,8}$" }
                  description: National-number prefixes (digits after +993) this gateway should serve, e.g. ["61","62","63","64","65"]. Empty means any number.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  api_key: { type: string, example: gw_Qm9... }
                  operator_prefixes: { type: array, items: { type: string } }
                  created_at: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`GATEWAY_EXISTS`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/trips:
    get:
      tags: [trips]
      summary: Search bookable trips
      description: |
        Requires a JWT. `from` and `to` are location ids. When either id is a
        welayat, the search includes that location if it is active and every
        active descendant, walking through inactive parents. Cancelled, full,
        completed, expired and past trips are excluded, as are trips with no
        seats left, trips of a deleted or admin-blocked driver, and trips whose
        driver is blocked in either direction with the caller. Results are
        ordered by `departs_at` ascending. `date` is a `YYYY-MM-DD` calendar
        day in Asia/Ashgabat (UTC+5). `seats` is the minimum `seats_left`.
        `page` defaults to 1 and `page_size` to 20 (maximum 50). The payload
        never includes a phone number.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: from, in: query, schema: { type: string, format: uuid } }
        - { name: to, in: query, schema: { type: string, format: uuid } }
        - { name: date, in: query, schema: { type: string, format: date }, description: "Calendar day in Asia/Ashgabat, YYYY-MM-DD." }
        - { name: seats, in: query, schema: { type: integer, minimum: 1, maximum: 8 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Matching trips
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [trips]
      summary: Publish a trip
      description: |
        The driver must send `departs_at` in the future, `seats_total` from 1
        to 8, two different active locations, and, when set, a vehicle that
        belongs to them. `suggested_price` is an informational decimal string
        or number. Currency defaults to `TMT`.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/AcceptLanguage" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_location_id, to_location_id, departs_at, seats_total]
              properties:
                vehicle_id: { type: string, format: uuid, nullable: true }
                from_location_id: { type: string, format: uuid }
                to_location_id: { type: string, format: uuid }
                departs_at: { type: string, format: date-time }
                seats_total: { type: integer, minimum: 1, maximum: 8 }
                suggested_price: { type: string, nullable: true, example: "25.50", description: "A JSON number is also accepted." }
                currency: { type: string, minLength: 3, maxLength: 3, example: TMT }
                pickup_note: { type: string, maxLength: 500 }
                dropoff_note: { type: string, maxLength: 500 }
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Created trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/trips/{id}:
    get:
      tags: [trips]
      summary: Get a trip
      description: Any status is returned. A caller blocked in either direction with the driver receives `TRIP_NOT_FOUND`, except the driver, who always sees their own trip. No phone number.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`TRIP_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [trips]
      summary: Update the driver's trip
      description: |
        Only the driver, and only while the trip is `active` or `full`.
        `seats_total` cannot drop below the number of already approved seats.
        `seats_left` moves with that change. Zero seats left sets status
        `full`; freeing a seat on a full trip sets it back to `active`.
        Send `vehicle_id` or `suggested_price` as null to clear them.
        Another caller receives `403 FORBIDDEN`.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle_id: { type: string, format: uuid, nullable: true }
                from_location_id: { type: string, format: uuid }
                to_location_id: { type: string, format: uuid }
                departs_at: { type: string, format: date-time }
                seats_total: { type: integer, minimum: 1, maximum: 8 }
                suggested_price: { type: string, nullable: true, example: "25.50" }
                currency: { type: string, minLength: 3, maxLength: 3 }
                pickup_note: { type: string, maxLength: 500 }
                dropoff_note: { type: string, maxLength: 500 }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`TRIP_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`INVALID_STATE` when the trip is not editable or seats would fall below approved seats"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/trips/{id}/cancel:
    post:
      tags: [trips]
      summary: Cancel a trip and its live bookings
      description: |
        Driver only. One transaction sets the trip to `cancelled` and every
        pending or approved booking to `cancelled_by_driver`. Repeating the
        call is a no-op. Each affected passenger is handed to the Notifier as
        `trip_cancelled`.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Cancelled trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`TRIP_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`INVALID_STATE` for a completed or expired trip"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/trips/{id}/complete:
    post:
      tags: [trips]
      summary: Mark a trip completed
      description: Driver only, and only at or after `departs_at`, while the trip is `active` or `full`. Bookings are not changed. Repeating it is a no-op.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Completed trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`TRIP_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`INVALID_STATE` before departure, or when the trip is cancelled or expired"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/trips:
    get:
      tags: [trips]
      summary: List the caller's trips as driver
      description: Optional `status` is `active`, `full`, `cancelled`, `completed` or `expired`. Newest departure first. No phone numbers.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: status, in: query, schema: { type: string, enum: [active, full, cancelled, completed, expired] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Driver trips
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/trips/{id}/bookings:
    post:
      tags: [bookings]
      summary: Request seats
      description: |
        The passenger cannot book their own trip or a user blocked in either
        direction (`403 FORBIDDEN`). The trip must be `active`, in the future,
        and have enough `seats_left` (`409 SEAT_UNAVAILABLE` otherwise; another
        bad state is `409 INVALID_STATE`). Pending requests do not reserve
        seats. A second pending or approved request by the same passenger is
        `409 BOOKING_EXISTS`. The response has no phone number.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats: { type: integer, minimum: 1, maximum: 8 }
      responses:
        "201":
          description: Pending booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`TRIP_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`SEAT_UNAVAILABLE`, `BOOKING_EXISTS` or `INVALID_STATE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [bookings]
      summary: List requests on the driver's trip
      description: Driver only. The passenger `phone` is present only when that booking is `approved`.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`TRIP_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/bookings:
    get:
      tags: [bookings]
      summary: List the caller's bookings as passenger
      description: Newest first. Each item includes the trip, which has no phone number. `driver_phone` is present only when the booking is `approved`.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Passenger bookings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/bookings/{id}/approve:
    post:
      tags: [bookings]
      summary: Approve a booking
      description: |
        Driver only. One transaction locks the trip row (`SELECT ... FOR UPDATE`),
        checks that the trip is `active` and `seats_left` covers the request,
        decrements `seats_left`, sets the trip to `full` when it reaches 0, and
        sets the booking to `approved`. A repeated approve does not take the
        seats again. Not enough seats is `409 SEAT_UNAVAILABLE`. The response,
        seen by the driver, includes the passenger phone.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Approved booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`BOOKING_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`SEAT_UNAVAILABLE` or `INVALID_STATE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/bookings/{id}/reject:
    post:
      tags: [bookings]
      summary: Reject a pending booking
      description: Driver only. An approved booking must be cancelled instead (`409 INVALID_STATE`). Rejecting twice is a no-op. No seat change and no phone number.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Rejected booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`BOOKING_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`INVALID_STATE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/bookings/{id}/cancel:
    post:
      tags: [bookings]
      summary: Cancel a booking
      description: |
        The passenger or the driver. Pending bookings change status only.
        Cancelling an approved booking locks the trip, restores `seats_left`,
        and sets a `full` trip back to `active`. That is refused with
        `409 INVALID_STATE` when the trip is no longer `active` or `full`, or
        when the stored seats cannot accept the restored seats. Repeating a
        cancel is a no-op. After cancel the response has no phone number.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Cancelled booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`BOOKING_NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`INVALID_STATE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/trips/{id}/reviews:
    post:
      tags: [reviews]
      summary: Review a participant of a completed trip
      description: |
        The reviewer and `to_user_id` must be the driver and a passenger with an
        approved booking, in either direction. Passengers cannot review each
        other. One review per direction. The trip must be `completed` and
        `departs_at` must be within `REVIEW_WINDOW` (default 14 days). The
        recipient's `rating_avg` and `rating_count` update in the same
        transaction. The response has no phone number.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_user_id, rating]
              properties:
                to_user_id: { type: string, format: uuid }
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Review stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`TRIP_NOT_FOUND` or the recipient does not exist"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`INVALID_STATE`, `REVIEW_EXISTS`, or `REVIEW_WINDOW_CLOSED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/users/{id}/reviews:
    get:
      tags: [reviews]
      summary: List reviews about a user
      description: |
        Newest first. Page defaults are the same as trip search. Reviewer phone
        numbers are not included. A missing or deleted user is `404`.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/users/{id}/block:
    post:
      tags: [safety]
      summary: Block a user
      description: |
        Idempotent. `201` when the block is new, `200` when it already existed.
        A block hides trips from search in both directions and rejects a new
        booking or approval of a still-pending request. An already approved
        booking is left as it is. Blocking yourself is `403`.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The block already existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        "201":
          description: Block created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [safety]
      summary: Remove a block
      description: Idempotent. `204` whether or not the block existed.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Block removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`NOT_FOUND` when the id is not a UUID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/blocks:
    get:
      tags: [safety]
      summary: List users the caller has blocked
      description: Newest first. Phone numbers are not included.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Blocks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/reports:
    post:
      tags: [safety]
      summary: Report a user
      description: |
        Rate limited per user (`REPORT_USER_LIMIT` per `REPORT_USER_WINDOW`,
        default 10 per 24 hours). Reporting yourself is `403`. `trip_id` is
        optional and must refer to an existing trip.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reported_user_id, reason]
              properties:
                reported_user_id: { type: string, format: uuid }
                trip_id: { type: string, format: uuid }
                reason:
                  type: string
                  enum: [spam, harassment, scam, unsafe_driving, no_show, other]
                details: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: Report filed with status `open`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`NOT_FOUND` when the reported user does not exist"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/notifications:
    get:
      tags: [notifications]
      summary: List the caller's inbox
      description: |
        Cursor pagination, newest first. `limit` defaults to 20 and cannot
        exceed 50. `unread_count` is the total unread rows, not the page size.
        `title` and `body` are localized from the recipient's saved `locale`,
        not from `Accept-Language`. Payload contains only `actor_id`, `trip_id`,
        and `booking_id`. Phone numbers are never stored.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Inbox page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/me/notifications/read:
    post:
      tags: [notifications]
      summary: Mark inbox rows read
      description: |
        Send `{"all": true}` or `{"ids": ["..."]}`. Ids that are not the
        caller's unread rows are ignored. The response is the remaining unread count.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { $ref: "#/components/parameters/AcceptLanguage" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                all: { type: boolean }
                ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Remaining unread count
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /admin/v1/reports:
    get:
      tags: [admin]
      summary: List reports
      description: Optional `status` is `open`, `reviewing`, `resolved`, or `dismissed`. Newest first.
      security: [ { adminToken: [] } ]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, reviewing, resolved, dismissed] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /admin/v1/reports/{id}:
    patch:
      tags: [admin]
      summary: Update a report's status
      security: [ { adminToken: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, reviewing, resolved, dismissed] }
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /admin/v1/users/{id}/block:
    post:
      tags: [admin]
      summary: Block a user
      description: |
        Sets `is_blocked`, revokes every refresh token, and runs the account-deletion
        cascade (cancels active and full trips and their live bookings, cancels the
        user's live bookings on other trips, deletes vehicles) without anonymizing
        the profile. Unblocking does not restore any of that.
      security: [ { adminToken: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: User is blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserModeration" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [admin]
      summary: Unblock a user
      description: Clears `is_blocked`. Trips, bookings, vehicles, and refresh tokens are not restored.
      security: [ { adminToken: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: User is not blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserModeration" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/v1/locations/{id}:
    patch:
      tags: [admin]
      summary: Activate or deactivate a location
      description: |
        Only `is_active` changes. Existing trips keep their location ids.
        New trips cannot use an inactive location. Search already skips inactive endpoints.
      security: [ { adminToken: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean }
      responses:
        "200":
          description: Updated location
          content:
            application/json:
              schema:
                type: object
                required: [id, type, is_active]
                properties:
                  id: { type: string, format: uuid }
                  type: { type: string, enum: [welayat, city, etrap] }
                  is_active: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`NOT_FOUND`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /admin/v1/sms/stats:
    get:
      tags: [admin]
      summary: SMS queue counts
      security: [ { adminToken: [] } ]
      responses:
        "200":
          description: Counts by status
          content:
            application/json:
              schema:
                type: object
                required: [pending, processing, sent, failed]
                properties:
                  pending: { type: integer }
                  processing: { type: integer }
                  sent: { type: integer }
                  failed: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    gatewayKey:
      type: http
      scheme: bearer
      description: Per-gateway API key returned by POST /admin/v1/gateways.
    adminToken:
      type: http
      scheme: bearer
      description: Static ADMIN_TOKEN from the server environment.

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string, example: ru }

  responses:
    BadRequest:
      description: "`BAD_REQUEST` (malformed JSON or unknown field) or `PAYLOAD_TOO_LARGE` (413)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: "`VALIDATION_ERROR` with field details, or `INVALID_PHONE`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`UNAUTHORIZED`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`FORBIDDEN`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`RATE_LIMITED`. The `Retry-After` header gives the wait in seconds."
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - VALIDATION_ERROR
                - PAYLOAD_TOO_LARGE
                - INVALID_PHONE
                - OTP_INVALID
                - OTP_EXPIRED
                - OTP_ATTEMPTS_EXCEEDED
                - RATE_LIMITED
                - UNAUTHORIZED
                - FORBIDDEN
                - USER_BLOCKED
                - REFRESH_TOKEN_INVALID
                - REFRESH_TOKEN_EXPIRED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - INTERNAL
                - SMS_NOT_FOUND
                - GATEWAY_EXISTS
                - PHOTO_TOO_LARGE
                - PHOTO_TYPE_UNSUPPORTED
                - VEHICLE_LIMIT
                - SEAT_UNAVAILABLE
                - TRIP_NOT_FOUND
                - BOOKING_NOT_FOUND
                - INVALID_STATE
                - BOOKING_EXISTS
                - REVIEW_EXISTS
                - REVIEW_WINDOW_CLOSED
            message: { type: string, description: Localized per Accept-Language. }
            details:
              type: object
              additionalProperties: { type: string }
              description: Field -> failed validation rule. Only for VALIDATION_ERROR.

    Readiness:
      type: object
      properties:
        status: { type: string, enum: [ok, unavailable] }
        database: { type: string, enum: [up, down] }
        sms_gateway_healthy: { type: boolean }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, example: "+99365123456" }
        name: { type: string }
        photo_url: { type: string, nullable: true }
        rating_avg: { type: number, format: double }
        rating_count: { type: integer }
        locale: { type: string, enum: [tk, ru, en] }
        created_at: { type: string, format: date-time }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token: { type: string, description: JWT, valid for ACCESS_TOKEN_TTL (15m). }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds, example: 900 }
        refresh_token: { type: string, description: Opaque, valid for REFRESH_TOKEN_TTL (30d), single use. }

    PublicProfile:
      type: object
      required: [id, name, photo_url, rating_avg, rating_count, vehicle, completed_trips]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        photo_url: { type: string, nullable: true }
        rating_avg: { type: number, format: double }
        rating_count: { type: integer }
        vehicle:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/PublicVehicle" } ]
        completed_trips:
          type: integer
          description: Completed trips driven, plus completed trips ridden with an approved booking.

    PublicVehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        brand: { type: string }
        model: { type: string }
        color: { type: string }
        plate: { type: string }

    Vehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        brand: { type: string }
        model: { type: string }
        color: { type: string }
        plate: { type: string }
        created_at: { type: string, format: date-time }

    LocationList:
      type: object
      required: [locations]
      properties:
        locations:
          type: array
          items: { $ref: "#/components/schemas/Location" }

    Location:
      type: object
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [welayat, city, etrap] }
        name: { type: string, description: Localized from Accept-Language. }
        is_active: { type: boolean }
        sort_order: { type: integer }

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenResponse"
        - type: object
          required: [user, is_new_user]
          properties:
            user: { $ref: "#/components/schemas/User" }
            is_new_user: { type: boolean }

    GatewayMessage:
      type: object
      required: [id, phone, message, attempts, locked_until, created_at]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, example: "+99365123456" }
        message: { type: string, example: "Carpool: kod 482913. Kimseyle paylasmanyn." }
        attempts: { type: integer, description: Previous failed delivery attempts. }
        locked_until: { type: string, format: date-time, description: Report before this time or the message is re-queued. }
        created_at: { type: string, format: date-time }

    TripPage:
      type: object
      required: [trips, page, page_size, has_more]
      properties:
        trips:
          type: array
          items: { $ref: "#/components/schemas/Trip" }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }

    Trip:
      type: object
      required: [id, driver, vehicle, from, to, departs_at, seats_total, seats_left, suggested_price, currency, status]
      description: A trip never includes a phone number.
      properties:
        id: { type: string, format: uuid }
        driver: { $ref: "#/components/schemas/TripDriver" }
        vehicle:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/TripVehicle" } ]
        from: { $ref: "#/components/schemas/TripPlace" }
        to: { $ref: "#/components/schemas/TripPlace" }
        departs_at: { type: string, format: date-time }
        seats_total: { type: integer }
        seats_left: { type: integer }
        suggested_price: { type: string, nullable: true, example: "25.50" }
        currency: { type: string, example: TMT }
        pickup_note: { type: string, nullable: true }
        dropoff_note: { type: string, nullable: true }
        note: { type: string, nullable: true }
        status: { type: string, enum: [active, full, cancelled, completed, expired] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TripDriver:
      type: object
      description: Public driver card. No phone number.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        photo_url: { type: string, nullable: true }
        rating_avg: { type: number, format: double }
        rating_count: { type: integer }

    TripVehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        brand: { type: string }
        model: { type: string }
        color: { type: string }
        plate: { type: string }

    TripPlace:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [welayat, city, etrap] }
        name: { type: string, description: Localized from Accept-Language. }

    BookingPage:
      type: object
      required: [bookings, page, page_size, has_more]
      properties:
        bookings:
          type: array
          items: { $ref: "#/components/schemas/Booking" }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }

    Booking:
      type: object
      required: [id, trip_id, seats, status, passenger, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        trip_id: { type: string, format: uuid }
        seats: { type: integer }
        status:
          type: string
          enum: [pending, approved, rejected, cancelled_by_passenger, cancelled_by_driver]
        passenger: { $ref: "#/components/schemas/BookingPassenger" }
        driver_phone:
          type: string
          description: Present only for the passenger, and only when status is approved.
        trip:
          allOf: [ { $ref: "#/components/schemas/Trip" } ]
          description: Present on GET /v1/me/bookings. The nested trip has no phone number.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BookingPassenger:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        photo_url: { type: string, nullable: true }
        phone:
          type: string
          description: Present only for the driver, and only when the booking is approved.

    ReviewPage:
      type: object
      required: [reviews, page, page_size, has_more]
      properties:
        reviews:
          type: array
          items: { $ref: "#/components/schemas/Review" }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }

    Review:
      type: object
      description: A review never includes a phone number.
      required: [id, trip_id, from_user, to_user_id, rating, created_at]
      properties:
        id: { type: string, format: uuid }
        trip_id: { type: string, format: uuid }
        from_user:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            photo_url: { type: string, nullable: true }
        to_user_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    BlockPage:
      type: object
      required: [blocks, page, page_size, has_more]
      properties:
        blocks:
          type: array
          items: { $ref: "#/components/schemas/Block" }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }

    Block:
      type: object
      description: A blocked user. No phone number.
      required: [user_id, name, created_at]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        photo_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    ReportPage:
      type: object
      required: [reports, page, page_size, has_more]
      properties:
        reports:
          type: array
          items: { $ref: "#/components/schemas/Report" }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }

    Report:
      type: object
      required: [id, reporter_id, reported_user_id, reason, status, created_at]
      properties:
        id: { type: string, format: uuid }
        reporter_id: { type: string, format: uuid }
        reported_user_id: { type: string, format: uuid }
        trip_id: { type: string, format: uuid, nullable: true }
        reason: { type: string, enum: [spam, harassment, scam, unsafe_driving, no_show, other] }
        details: { type: string, nullable: true }
        status: { type: string, enum: [open, reviewing, resolved, dismissed] }
        created_at: { type: string, format: date-time }

    NotificationPage:
      type: object
      required: [notifications, unread_count]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unread_count: { type: integer }
        next_cursor: { type: string }

    Notification:
      type: object
      required: [id, type, title, body, payload, created_at]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [booking_requested, booking_approved, booking_rejected, booking_cancelled, trip_cancelled]
        title: { type: string }
        body: { type: string }
        payload:
          type: object
          additionalProperties: { type: string }
          description: Only actor_id, trip_id, and booking_id. Never a phone number.
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    UserModeration:
      type: object
      required: [id, is_blocked]
      properties:
        id: { type: string, format: uuid }
        is_blocked: { type: boolean }
